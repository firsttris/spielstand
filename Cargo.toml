[workspace]
resolver = "3"
members = ["crates/protocol", "crates/core", "crates/server", "crates/agent"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/firsttris/spielstand"
authors = ["Tristan Teufel"]
rust-version = "1.88"

[workspace.dependencies]
spielstand-protocol = { path = "crates/protocol" }
spielstand-core = { path = "crates/core" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
ts-rs = { version = "12", features = ["serde-json-impl", "chrono-impl", "no-serde-warnings"] }

[profile.release]
lto = "thin"
strip = true

# Line tables are enough for backtraces; full debug info made every test binary huge.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
