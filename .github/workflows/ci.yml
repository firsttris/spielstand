name: CI

on:
  push:
    branches: [main]            # not every branch, pull requests build through pull_request
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:                # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Generates the router tree and the Paraglide messages the type check reads
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  rust:
    if: ${{ !github.event.pull_request.draft }}
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the property-based sync simulation with SPIELSTAND_SIM_CASES cases
      - run: cargo test --workspace --locked
        env:
          SPIELSTAND_SIM_CASES: 64
      - name: TypeScript bindings are up to date
        run: |
          cargo test -p spielstand-protocol --features ts --locked
          git diff --exit-code -- web/src/bindings
      - name: Install script
        run: |
          shellcheck install/install.sh install/test.sh
          cargo build -p spielstand-server -p spielstand-agent --locked
          install/test.sh target/debug
      # The demo server for the end-to-end tests; a debug build carries the web UI too
      - run: cargo build -p spielstand-server --example demo --locked
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: target/debug/examples/demo
          retention-days: 3

  playwright-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: web/pnpm-lock.yaml

  e2e:
    needs: [rust, playwright-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo
          path: demo
      - run: chmod +x ../demo/demo
      - run: npm install --global pnpm@10.28.0 && pnpm install --frozen-lockfile
      - run: pnpm e2e
        env:
          SPIELSTAND_DEMO_BIN: ${{ github.workspace }}/demo/demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: spielstand:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts and serves the UI, install.sh and the agent
        run: |
          docker run -d --name spielstand -p 8467:8467 spielstand:ci
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:8467/healthz && break; sleep 0.2; done
          curl -fs http://127.0.0.1:8467/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:8467/install.sh | grep -q 'spielstand-agent'
          curl -fsI http://127.0.0.1:8467/download/agent/x86_64 | grep -qi 'application/octet-stream'
          docker exec spielstand spielstand-server health
          docker exec spielstand rclone version
