name: Update screenshots

# The project's own job instead of the reusable screenshots workflow: the demo server is Rust,
# built here on the runner and handed to the Playwright container, which has no Rust.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p spielstand-server --example demo --locked
      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: target/debug/examples/demo
          retention-days: 1

  image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: web/bun.lock

  screenshots:
    needs: [demo, image]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --ipc=host
    # Two runs at once would push on top of each other
    concurrency:
      group: screenshots-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: demo
          path: demo
      - run: chmod +x demo/demo
      # The npm package brings the binary without curl or unzip, which the image lacks; the
      # version is `packageManager` in package.json, as setup-bun takes it elsewhere
      - run: npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: bun install --frozen-lockfile && bun run screenshots
        working-directory: web
        env:
          SPIELSTAND_DEMO_BIN: ${{ github.workspace }}/demo/demo
      - uses: firsttris/workflows/actions/commit-changes@v1
        with:
          paths: docs/screenshots
          message: Update screenshots
