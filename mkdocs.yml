site_name: Spielstand
site_description: Self-hosted game save sync for Linux PCs and the Steam Deck, with versions, conflict handling and a web UI
site_url: https://firsttris.github.io/spielstand/
repo_url: https://github.com/firsttris/spielstand
repo_name: firsttris/spielstand
edit_uri: edit/main/docs/
copyright: Spielstand by Tristan Teufel · AGPL-3.0 · commercial license via <a href="https://teufel-it.de">teufel-it.de</a>
use_directory_urls: false

theme:
  name: material
  language: en
  icon:
    logo: material/shield-check
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Installation: installation.md
  - How syncing works: how-it-works.md
  - Coming from Ludusavi: ludusavi.md
  - The agent: agent.md
  - Configuration: configuration.md
  - Backup and recovery: recovery.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
